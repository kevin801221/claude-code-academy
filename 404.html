body.m-teams{--mod:var(--blue);--mod-soft:var(--blue-soft);--mod-2:var(--purple)}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--border);padding:.05em .4em;border-radius:6px;word-break:break-word}
.c-accent{--c:var(--accent);--c-soft:var(--accent-soft)}
.c-green{--c:var(--green);--c-soft:var(--green-soft)}

/* top bar */
.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:60;pointer-events:none}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mod),var(--mod-2))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}

.icon-btn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 15px/1.2 var(--sans);cursor:pointer;text-decoration:none;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s}

.callout b{color:var(--c,var(--mod))}

.empty{color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:10px;padding:22px 12px;text-align:center}

/* terminal */
.term{background:var(--term-bg);border-radius:14px;overflow:hidden;font:13px/1.75 var(--mono);color:var(--term-text);min-width:0}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:rgba(255,255,255,.05)}
.term-bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}

.term-bar span{margin-left:8px;color:var(--term-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-body{padding:14px 16px 16px}
.tl{white-space:pre-wrap;word-break:break-word}
.tl .ps{color:#f2a581}
.tl.ok{color:#7ee2a8}.tl.warn{color:#f5c26b}.tl.muted{color:var(--term-muted)}.tl.info{color:#8ab8ff}.tl.bad{color:#ff8a98}.tl.hl{color:#d3b8ff}
.caret{display:inline-block;width:8px;height:1.05em;background:var(--term-text);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
.hero .term{box-shadow:0 24px 60px rgba(20,10,0,.28);transform:rotate(-.6deg);animation:float 7s ease-in-out infinite}
.hero .term .term-body{min-height:260px;font-size:13.5px}

/* code block */
.code{border-radius:12px;overflow:hidden;background:var(--term-bg);color:var(--term-text);margin:12px 0}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:rgba(255,255,255,.06);font:12px var(--mono);color:var(--term-muted)}
.copy{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--term-text);font:600 12px var(--sans);padding:3px 10px;border-radius:7px;cursor:pointer}

.code .ps{color:#f2a581}

/* quiz */
.quiz{max-width:780px;margin:0 auto;padding:26px}
.q-anim{animation:slideIn .45s cubic-bezier(.2,.7,.2,1)}
.q-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-size:13.5px;color:var(--muted)}
.q-dots{display:flex;gap:6px}
.q-dots i{width:10px;height:10px;border-radius:50%;background:var(--border);transition:.3s}
.q-dots i.ok{background:var(--green)}.q-dots i.no{background:var(--red)}
.q-dots i.cur{outline:2px solid var(--mod);outline-offset:2px}
.q-text{font-size:clamp(18px,2.2vw,21px);font-weight:700;margin:0 0 18px;line-height:1.55}
.q-opts{display:flex;flex-direction:column;gap:10px}
.q-opt{text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .2s,border-color .2s,background .2s}
.q-opt .k{font:700 13px var(--mono);width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;transition:.2s}
.q-opt:hover:not(:disabled){border-color:var(--mod);transform:translateX(4px)}
.q-opt.correct{border-color:var(--green);background:var(--green-soft)}
.q-opt.correct .k{background:var(--green);color:#fff}
.q-opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .4s}
.q-opt.wrong .k{background:var(--red);color:#fff}
.q-opt:disabled{cursor:default}
.q-exp{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--surface-2);font-size:14.5px;display:none}
.q-exp.show{display:block;animation:popIn .35s}
.q-next{margin-top:16px}
.q-result{text-align:center;padding:10px 0}
.ring{width:150px;height:150px;margin:0 auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--mod);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font:800 32px var(--sans)}
.q-result h3{font-size:22px;margin:8px 0}
.q-result p{color:var(--muted)}
.q-result .row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.mod-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}

.mod-nav small{display:block;color:var(--muted);font-size:13px}
.mod-nav b{font-size:17px}
.mod-nav .next{text-align:right}

footer{padding:56px 0 70px;border-top:1px solid var(--border);color:var(--muted);font-size:14.5px}

footer ul{padding-left:20px;margin:0 0 18px}
footer li{margin:4px 0}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:100}

@keyframes popIn{from{opacity:0;transform:translateY(5px)}}
@keyframes blink{50%{opacity:0}}
@keyframes bump{40%{transform:scale(1.13)}}

}

}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 40) : ms));
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const root = document.documentElement;

/* theme */
const tb = $('#themeBtn');
if (tb) tb.addEventListener('click', () => {
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  try { localStorage.setItem('cm-theme', next); } catch (e) {}
});

/* scroll progress */
const bar = $('#progressBar');
const onScroll = () => {
  if (!bar) return;
  const h = document.documentElement;
  bar.style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100).toFixed(2) + '%';
};
addEventListener('scroll', onScroll, { passive: true }); onScroll();

/* chapter nav highlight */
const nav = $('#chapterNav');
if (nav) {
  const links = $$('a', nav);
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => {
        const on = a.getAttribute('href') === '#' + e.target.id;
        a.classList.toggle('on', on);
        if (on && nav.scrollTo) nav.scrollTo({ left: a.offsetLeft - nav.clientWidth / 2 + a.clientWidth / 2, behavior: reduced ? 'auto' : 'smooth' });
      });
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  $$('section[id]').forEach(s => obs.observe(s));
}

/* reveal */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    revObs.unobserve(e.target);
    e.target.dispatchEvent(new CustomEvent('revealed'));
  });
}, { threshold: 0.12 });
$$('.reveal').forEach(el => revObs.observe(el));

/* confetti */
function confetti(el) {
  if (reduced || !el) return;
  const r = el.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const colors = ['var(--accent)', 'var(--green)', 'var(--blue)', 'var(--purple)', '#f2c14e'];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 150;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 70;
    p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + (dy + 140) + 'px) rotate(' + (Math.random() * 720) + 'deg)', opacity: 0 }
    ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => p.remove());
  }
}

/* copy buttons */
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext !== false) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}
function fallbackCopy(text) {
  return new Promise(res => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove(); res();
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const src = b.dataset.copy ? document.getElementById(b.dataset.copy) : b.closest('.code').querySelector('pre');
  if (!src) return;
  copyText(src.innerText.trim()).then(() => {
    const old = b.dataset.label || b.textContent;
    b.dataset.label = old;
    b.textContent = '已複製 ✓';
    setTimeout(() => { b.textContent = old; }, 1500);
  });
});

/* progress storage (shared across pages) */
function getProgress() {
  try { return JSON.parse(localStorage.getItem('cca-progress') || '{}') || {}; } catch (e) { return {}; }
}
function saveProgress(key, score, total) {
  try {
    const p = getProgress();
    if (!p[key] || score >= p[key].score) p[key] = { score, total };
    localStorage.setItem('cca-progress', JSON.stringify(p));
  } catch (e) {}
}

/* quiz engine */
function quiz(box, QUIZ, key, nextLink) {
  let qi = 0, qScore = 0, qRes = [];
  function render() {
    if (qi >= QUIZ.length) return result();
    const Q = QUIZ[qi];
    box.innerHTML = '<div class="q-anim"><div class="q-top"><span>第 ' + (qi + 1) + ' / ' + QUIZ.length + ' 題</span><div class="q-dots">' +
      QUIZ.map((_, i) => '<i class="' + (qRes[i] === true ? 'ok' : qRes[i] === false ? 'no' : '') + (i === qi ? ' cur' : '') + '"></i>').join('') + '</div></div>' +
      '<p class="q-text">' + Q.q + '</p><div class="q-opts">' +
      Q.o.map((o, i) => '<button class="q-opt" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span><span>' + o + '</span></button>').join('') +
      '</div><div class="q-exp"></div><button class="btn primary q-next" hidden>' + (qi === QUIZ.length - 1 ? '看結果' : '下一題') + ' →</button></div>';
  }
  function answer(i) {
    const Q = QUIZ[qi], ok = i === Q.a;
    const opts = $$('.q-opt', box);
    opts.forEach(o => { o.disabled = true; });
    opts[Q.a].classList.add('correct');
    if (!ok) opts[i].classList.add('wrong');
    qRes[qi] = ok; if (ok) qScore++;
    $$('.q-dots i', box)[qi].classList.add(ok ? 'ok' : 'no');
    const exp = $('.q-exp', box);
    exp.innerHTML = (ok ? '<b style="color:var(--green)">✓ 答對了！</b> ' : '<b style="color:var(--red)">✕ 差一點。</b> ') + Q.e;
    exp.classList.add('show');
    const nx = $('.q-next', box); nx.hidden = false; nx.focus({ preventScroll: true });
  }
  function result() {
    const pct = qScore / QUIZ.length, C = 2 * Math.PI * 60;
    saveProgress(key, qScore, QUIZ.length);
    const msg = qScore === QUIZ.length ? '滿分！這個模組你已經完全掌握。'
      : pct >= 0.7 ? '很棒！回頭看看答錯的題目，就更完整了。'
      : '建議再玩一次上面的互動區，加深印象後再挑戰。';
    box.innerHTML = '<div class="q-anim q-result"><div class="ring"><svg viewBox="0 0 140 140"><circle class="bg" cx="70" cy="70" r="60"/><circle class="fg" cx="70" cy="70" r="60" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/></svg><div class="val">' + qScore + '/' + QUIZ.length + '</div></div>' +
      '<h3>' + (qScore === QUIZ.length ? '完美通關' : '測驗完成') + '</h3><p>' + msg + '</p><div class="row-btns"><button class="btn q-retry">↻ 再測一次</button>' +
      (nextLink ? '<a class="btn primary" href="' + nextLink[0] + '">' + nextLink[1] + ' →</a>' : '') + '</div></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => { $('.ring .fg', box).style.strokeDashoffset = C * (1 - pct); }));
    if (pct >= 0.7) setTimeout(() => confetti($('.ring', box)), 700);
  }
  box.addEventListener('click', e => {
    const o = e.target.closest('.q-opt');
    if (o && !o.disabled) return answer(+o.dataset.i);
    if (e.target.closest('.q-next')) { qi++; render(); return; }
    if (e.target.closest('.q-retry')) { qi = 0; qScore = 0; qRes = []; render(); }
  });
  render();
}

/* typing helper for terminals */
async function typeInto(el, text, speed) {
  for (const ch of text) { el.textContent += ch; await sleep(speed || 45); }
}

window.CC = { $, $$, reduced, sleep, restart, confetti, quiz, getProgress, saveProgress, typeInto, copyText };
})();
</script>

t）以非互動模式執行：送出 prompt、把結果以 text、json 或 stream-json 印到 stdou","demos.html#headless",""]],"map":[{"name":"開始","items":[["page","首頁","Kevin 的 Claude Code 互動學院","index.html"],["page","學習路線：入門 → 進階 → 高手","六站學完，不知道從哪開始就從這裡","index.html#path"],["page","名詞速查","各模組與館的關鍵名詞","index.html#glossary"]]},{"name":"三個模組","items":[["page","模組 01：Claude Memory","CLAUDE.md 的載入機制、monorepo 模擬器","memory.html"],["page","模組 02：Agent Teams 實作","多個 session 組隊、Command → Agent → Skill","agent-teams.html"],["page","模組 03：/goal 實作","跨回合持續工作直到條件成立","goal.html"]]},{"name":"心法集・功能演示館・方法論館","items":[["page","心法集","124 條實戰心法，每一步都有終端機模擬","tips.html"],["page","心法集：新手先看這 10 條","從 124 條裡挑出的基本功","tips.html#c-start"],["page","功能演示館","13 個核心功能的逐步動畫","demos.html"],["page","方法論館","6 套社群工作流的流程鏈動畫與比較","workflows.html"]]},{"name":"新手先看這 10 條","items":[["tip","多數 session 從 Plan 模式開始","Boris：13 個技巧","tips.html#t-boris-13-6"],["tip","團隊共用一份 CLAUDE.md","Boris：13 個技巧","tips.html#t-boris-13-4"],["tip","給 Claude 驗證自己工作的方法","Boris：13 個技巧","tips.html#t-boris-13-13"],["tip","新任務就開新 session","Thariq：Session 管理與 1M 脈絡","tips.html#t-thariq-sessions-3"],["tip","用倒回取代糾正","Thariq：Session 管理與 1M 脈絡","tips.html#t-thariq-sessions-4"],["tip","用 Auto 模式取代權限提示","Boris：讓 Opus 4.7 發揮更多的 6 個技巧","tips.html#t-boris-6-1"],["tip","建立 Skills 並 commit","Claude Code 團隊：10 個技巧","tips.html#t-team-10-4"],["tip","PostToolUse hook 自動格式化","Boris：13 個技巧","tips.html#t-boris-13-9"],["tip","用 Git Worktrees 平行工作","Boris：15 個隱藏功能","tips.html#t-boris-15-10"],["tip","可外包思考，不能外包理解","Karpathy：從 Vibe Coding 到 Agentic Engineering","tips.html#t-karpathy-9"]]}]};</script>
<script>
(() => {
'use strict';
const IDX = window.CC_INDEX || { items: [], map: [] };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ICON = { page: ['頁', 'c-accent'], mod: ['課', 'c-green'], tip: ['心', 'c-accent'], demo: ['演', 'c-purple'], wf: ['法', 'c-blue'], stage: ['階', 'c-blue'], term: ['詞', 'c-green'] };
const GROUP = { page: '頁面', mod: '模組章節', demo: '功能演示', wf: '方法論', stage: '方法論的階段', tip: '心法', term: '名詞' };
const ORDER = ['page', 'mod', 'demo', 'wf', 'stage', 'tip', 'term'];
const BOOST = { page: 3, mod: 2, demo: 2, wf: 2, term: 1, tip: 0, stage: 0 };
const DATA = (IDX.items || []).map(a => ({ k: a[0], t: a[1], s: a[2], u: a[3], x: (a[1] + ' ' + a[2] + ' ' + (a[4] || '')).toLowerCase() }));

const ov = document.createElement('div');
ov.className = 'ccp-ov';
ov.hidden = true;
ov.innerHTML = '<div class="ccp" role="dialog" aria-modal="true" aria-label="搜尋全站"><div class="ccp-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
  '<input type="search" id="ccpQ" placeholder="搜尋心法、功能、方法論、名詞…" autocomplete="off" spellcheck="false" aria-label="搜尋全站" aria-controls="ccpList"><kbd>Esc</kbd></div>' +
  '<div class="ccp-list" id="ccpList" role="listbox"></div><div class="ccp-foot"><span>↑ ↓ 選擇</span><span>Enter 開啟</span><span class="ccp-k">⌘K／Ctrl+K 或 / 隨時叫出</span></div></div>';
document.body.appendChild(ov);
const q = ov.querySelector('#ccpQ'), list = ov.querySelector('#ccpList');
let items = [], act = 0, lastFocus = null;

function hl(text, terms) {
  const low = text.toLowerCase(), mk = new Array(text.length).fill(false);
  terms.forEach(t => { let i = low.indexOf(t); while (t && i >= 0) { for (let j = i; j < i + t.length; j++) mk[j] = true; i = low.indexOf(t, i + t.length); } });
  let out = '', on = false;
  for (let i = 0; i < text.length; i++) {
    if (mk[i] && !on) { out += '<mark>'; on = true; }
    if (!mk[i] && on) { out += '</mark>'; on = false; }
    out += esc(text[i]);
  }
  return on ? out + '</mark>' : out;
}
function render() {
  const raw = q.value.trim(), terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  let groups;
  if (!terms.length) {
    groups = (IDX.map || []).map(g => ({ name: g.name, rows: g.items.map(a => ({ k: a[0], t: a[1], s: a[2], u: a[3] })) }));
  } else {
    const res = [];
    DATA.forEach(d => {
      if (!terms.every(t => d.x.includes(t))) return;
      const tl = d.t.toLowerCase();
      let sc = BOOST[d.k] || 0;
      terms.forEach(t => { if (tl.includes(t)) sc += 3; if (tl.startsWith(t)) sc += 2; });
      res.push([sc, d]);
    });
    res.sort((a, b) => b[0] - a[0]);
    const top = res.slice(0, 60).map(r => r[1]);
    groups = ORDER.map(k => ({ name: GROUP[k], rows: top.filter(d => d.k === k) })).filter(g => g.rows.length);
  }
  items = [];
  let h = '';
  groups.forEach(g => {
    h += '<div class="ccp-g">' + esc(g.name) + '</div>';
    g.rows.forEach(r => {
      const i = items.length, ic = ICON[r.k] || ICON.page;
      items.push(r);
      h += '<a class="ccp-i ' + ic[1] + '" role="option" id="ccpo' + i + '" data-i="' + i + '" href="' + esc(r.u) + '"><span class="ccp-ic">' + ic[0] + '</span><span class="tx"><b>' + hl(r.t, terms) + '</b>' + (r.s ? '<small>' + hl(r.s, terms) + '</small>' : '') + '</span></a>';
    });
  });
  list.innerHTML = h || '<div class="ccp-empty">找不到「' + esc(raw) + '」。換個關鍵字試試，例如 hooks、worktree、脈絡、grill。</div>';
  setAct(0);
}
function setAct(i) {
  if (!items.length) { q.removeAttribute('aria-activedescendant'); return; }
  act = (i + items.length) % items.length;
  list.querySelectorAll('.ccp-i').forEach(a => a.classList.toggle('on', +a.dataset.i === act));
  const el = list.querySelector('#ccpo' + act);
  if (el) { el.scrollIntoView({ block: 'nearest' }); q.setAttribute('aria-activedescendant', 'ccpo' + act); }
}
function go(i) {
  const r = items[i];
  if (!r) return;
  close(false);
  location.href = r.u;
}
function open() {
  if (!ov.hidden) return;
  lastFocus = document.activeElement;
  ov.hidden = false;
  q.value = '';
  render();
  document.documentElement.style.overflow = 'hidden';
  setTimeout(() => q.focus(), 0);
}
function close(restoreFocus) {
  if (ov.hidden) return;
  ov.hidden = true;
  document.documentElement.style.overflow = '';
  if (restoreFocus !== false && lastFocus && lastFocus.focus) lastFocus.focus();
}
q.addEventListener('input', render);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setAct(act + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(act - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); go(act); }
  else if (e.key === 'Escape') { e.preventDefault(); close(); }
});
ov.addEventListener('click', e => {
  if (e.target === ov) { close(); return; }
  const a = e.target.closest('.ccp-i');
  if (a) { e.preventDefault(); go(+a.dataset.i); }
});
list.addEventListener('mousemove', e => { const a = e.target.closest('.ccp-i'); if (a && +a.dataset.i !== act) setAct(+a.dataset.i); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (ov.hidden) open(); else close(); return; }
  const typing = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  if (e.key === '/' && ov.hidden && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); open(); }
});
const btn = document.getElementById('ccSearchBtn');
if (btn) btn.addEventListener('click', open);
window.CCSearch = { open, close };
})();
</script>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 40) : ms));
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const root = document.documentElement;

/* theme */
const tb = $('#themeBtn');
if (tb) tb.addEventListener('click', () => {
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  try { localStorage.setItem('cm-theme', next); } catch (e) {}
});

/* scroll progress */
const bar = $('#progressBar');
const onScroll = () => {
  if (!bar) return;
  const h = document.documentElement;
  bar.style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100).toFixed(2) + '%';
};
addEventListener('scroll', onScroll, { passive: true }); onScroll();

/* chapter nav highlight */
const nav = $('#chapterNav');
if (nav) {
  const links = $$('a', nav);
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => {
        const on = a.getAttribute('href') === '#' + e.target.id;
        a.classList.toggle('on', on);
        if (on && nav.scrollTo) nav.scrollTo({ left: a.offsetLeft - nav.clientWidth / 2 + a.clientWidth / 2, behavior: reduced ? 'auto' : 'smooth' });
      });
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  $$('section[id]').forEach(s => obs.observe(s));
}

/* reveal */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    revObs.unobserve(e.target);
    e.target.dispatchEvent(new CustomEvent('revealed'));
  });
}, { threshold: 0.12 });
$$('.reveal').forEach(el => revObs.observe(el));

/* confetti */
function confetti(el) {
  if (reduced || !el) return;
  const r = el.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const colors = ['var(--accent)', 'var(--green)', 'var(--blue)', 'var(--purple)', '#f2c14e'];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 150;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 70;
    p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + (dy + 140) + 'px) rotate(' + (Math.random() * 720) + 'deg)', opacity: 0 }
    ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => p.remove());
  }
}

/* copy buttons */
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext !== false) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}
function fallbackCopy(text) {
  return new Promise(res => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove(); res();
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const src = b.dataset.copy ? document.getElementById(b.dataset.copy) : b.closest('.code').querySelector('pre');
  if (!src) return;
  copyText(src.innerText.trim()).then(() => {
    const old = b.dataset.label || b.textContent;
    b.dataset.label = old;
    b.textContent = '已複製 ✓';
    setTimeout(() => { b.textContent = old; }, 1500);
  });
});

/* progress storage (shared across pages) */
function getProgress() {
  try { return JSON.parse(localStorage.getItem('cca-progress') || '{}') || {}; } catch (e) { return {}; }
}
function saveProgress(key, score, total) {
  try {
    const p = getProgress();
    if (!p[key] || score >= p[key].score) p[key] = { score, total };
    localStorage.setItem('cca-progress', JSON.stringify(p));
  } catch (e) {}
}

/* quiz engine */
function quiz(box, QUIZ, key, nextLink) {
  let qi = 0, qScore = 0, qRes = [];
  function render() {
    if (qi >= QUIZ.length) return result();
    const Q = QUIZ[qi];
    box.innerHTML = '<div class="q-anim"><div class="q-top"><span>第 ' + (qi + 1) + ' / ' + QUIZ.length + ' 題</span><div class="q-dots">' +
      QUIZ.map((_, i) => '<i class="' + (qRes[i] === true ? 'ok' : qRes[i] === false ? 'no' : '') + (i === qi ? ' cur' : '') + '"></i>').join('') + '</div></div>' +
      '<p class="q-text">' + Q.q + '</p><div class="q-opts">' +
      Q.o.map((o, i) => '<button class="q-opt" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span><span>' + o + '</span></button>').join('') +
      '</div><div class="q-exp"></div><button class="btn primary q-next" hidden>' + (qi === QUIZ.length - 1 ? '看結果' : '下一題') + ' →</button></div>';
  }
  function answer(i) {
    const Q = QUIZ[qi], ok = i === Q.a;
    const opts = $$('.q-opt', box);
    opts.forEach(o => { o.disabled = true; });
    opts[Q.a].classList.add('correct');
    if (!ok) opts[i].classList.add('wrong');
    qRes[qi] = ok; if (ok) qScore++;
    $$('.q-dots i', box)[qi].classList.add(ok ? 'ok' : 'no');
    const exp = $('.q-exp', box);
    exp.innerHTML = (ok ? '<b style="color:var(--green)">✓ 答對了！</b> ' : '<b style="color:var(--red)">✕ 差一點。</b> ') + Q.e;
    exp.classList.add('show');
    const nx = $('.q-next', box); nx.hidden = false; nx.focus({ preventScroll: true });
  }
  function result() {
    const pct = qScore / QUIZ.length, C = 2 * Math.PI * 60;
    saveProgress(key, qScore, QUIZ.length);
    const msg = qScore === QUIZ.length ? '滿分！這個模組你已經完全掌握。'
      : pct >= 0.7 ? '很棒！回頭看看答錯的題目，就更完整了。'
      : '建議再玩一次上面的互動區，加深印象後再挑戰。';
    box.innerHTML = '<div class="q-anim q-result"><div class="ring"><svg viewBox="0 0 140 140"><circle class="bg" cx="70" cy="70" r="60"/><circle class="fg" cx="70" cy="70" r="60" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/></svg><div class="val">' + qScore + '/' + QUIZ.length + '</div></div>' +
      '<h3>' + (qScore === QUIZ.length ? '完美通關' : '測驗完成') + '</h3><p>' + msg + '</p><div class="row-btns"><button class="btn q-retry">↻ 再測一次</button>' +
      (nextLink ? '<a class="btn primary" href="' + nextLink[0] + '">' + nextLink[1] + ' →</a>' : '') + '</div></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => { $('.ring .fg', box).style.strokeDashoffset = C * (1 - pct); }));
    if (pct >= 0.7) setTimeout(() => confetti($('.ring', box)), 700);
  }
  box.addEventListener('click', e => {
    const o = e.target.closest('.q-opt');
    if (o && !o.disabled) return answer(+o.dataset.i);
    if (e.target.closest('.q-next')) { qi++; render(); return; }
    if (e.target.closest('.q-retry')) { qi = 0; qScore = 0; qRes = []; render(); }
  });
  render();
}

/* typing helper for terminals */
async function typeInto(el, text, speed) {
  for (const ch of text) { el.textContent += ch; await sleep(speed || 45); }
}

window.CC = { $, $$, reduced, sleep, restart, confetti, quiz, getProgress, saveProgress, typeInto, copyText };
})();
</script>

<script src="search-index.js"></script>
<script>
(() => {
'use strict';
const IDX = window.CC_INDEX || { items: [], map: [] };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ICON = { page: ['頁', 'c-accent'], learn: ['教', 'c-green'], mod: ['課', 'c-green'], tip: ['心', 'c-accent'], demo: ['演', 'c-purple'], wf: ['法', 'c-blue'], stage: ['階', 'c-blue'], ref: ['查', 'c-purple'], term: ['詞', 'c-green'] };
const GROUP = { page: '頁面', learn: '新手教學', mod: '模組章節', demo: '功能演示', wf: '方法論', stage: '方法論的階段', ref: '參考手冊', tip: '心法', term: '名詞' };
const ORDER = ['page', 'learn', 'mod', 'demo', 'wf', 'ref', 'stage', 'tip', 'term'];
const BOOST = { page: 3, learn: 2, mod: 2, demo: 2, wf: 2, ref: 1, term: 1, tip: 0, stage: 0 };
const DATA = (IDX.items || []).map(a => ({ k: a[0], t: a[1], s: a[2], u: a[3], x: (a[1] + ' ' + a[2] + ' ' + (a[4] || '')).toLowerCase() }));

const ov = document.createElement('div');
ov.className = 'ccp-ov';
ov.hidden = true;
ov.innerHTML = '<div class="ccp" role="dialog" aria-modal="true" aria-label="搜尋全站"><div class="ccp-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
  '<input type="search" id="ccpQ" placeholder="搜尋心法、功能、方法論、名詞…" autocomplete="off" spellcheck="false" aria-label="搜尋全站" aria-controls="ccpList"><kbd>Esc</kbd></div>' +
  '<div class="ccp-list" id="ccpList" role="listbox"></div><div class="ccp-foot"><span>↑ ↓ 選擇</span><span>Enter 開啟</span><span class="ccp-k">⌘K／Ctrl+K 或 / 隨時叫出</span></div></div>';
document.body.appendChild(ov);
const q = ov.querySelector('#ccpQ'), list = ov.querySelector('#ccpList');
let items = [], act = 0, lastFocus = null;

function hl(text, terms) {
  const low = text.toLowerCase(), mk = new Array(text.length).fill(false);
  terms.forEach(t => { let i = low.indexOf(t); while (t && i >= 0) { for (let j = i; j < i + t.length; j++) mk[j] = true; i = low.indexOf(t, i + t.length); } });
  let out = '', on = false;
  for (let i = 0; i < text.length; i++) {
    if (mk[i] && !on) { out += '<mark>'; on = true; }
    if (!mk[i] && on) { out += '</mark>'; on = false; }
    out += esc(text[i]);
  }
  return on ? out + '</mark>' : out;
}
function render() {
  const raw = q.value.trim(), terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  let groups;
  if (!terms.length) {
    groups = (IDX.map || []).map(g => ({ name: g.name, rows: g.items.map(a => ({ k: a[0], t: a[1], s: a[2], u: a[3] })) }));
  } else {
    const res = [];
    DATA.forEach(d => {
      if (!terms.every(t => d.x.includes(t))) return;
      const tl = d.t.toLowerCase();
      let sc = BOOST[d.k] || 0;
      terms.forEach(t => { if (tl.includes(t)) sc += 3; if (tl.startsWith(t)) sc += 2; });
      res.push([sc, d]);
    });
    res.sort((a, b) => b[0] - a[0]);
    const top = res.slice(0, 60).map(r => r[1]);
    groups = ORDER.map(k => ({ name: GROUP[k], rows: top.filter(d => d.k === k) })).filter(g => g.rows.length);
  }
  items = [];
  let h = '';
  groups.forEach(g => {
    h += '<div class="ccp-g">' + esc(g.name) + '</div>';
    g.rows.forEach(r => {
      const i = items.length, ic = ICON[r.k] || ICON.page;
      items.push(r);
      h += '<a class="ccp-i ' + ic[1] + '" role="option" id="ccpo' + i + '" data-i="' + i + '" href="' + esc(r.u) + '"><span class="ccp-ic">' + ic[0] + '</span><span class="tx"><b>' + hl(r.t, terms) + '</b>' + (r.s ? '<small>' + hl(r.s, terms) + '</small>' : '') + '</span></a>';
    });
  });
  list.innerHTML = h || (DATA.length ? '<div class="ccp-empty">找不到「' + esc(raw) + '」。換個關鍵字試試，例如 hooks、worktree、脈絡、grill。</div>' : '<div class="ccp-empty">搜尋索引還沒載入（search-index.js）。重新整理頁面再試一次。</div>');
  setAct(0);
}
function setAct(i) {
  if (!items.length) { q.removeAttribute('aria-activedescendant'); return; }
  act = (i + items.length) % items.length;
  list.querySelectorAll('.ccp-i').forEach(a => a.classList.toggle('on', +a.dataset.i === act));
  const el = list.querySelector('#ccpo' + act);
  if (el) { el.scrollIntoView({ block: 'nearest' }); q.setAttribute('aria-activedescendant', 'ccpo' + act); }
}
function go(i) {
  const r = items[i];
  if (!r) return;
  close(false);
  location.href = r.u;
}
function open() {
  if (!ov.hidden) return;
  lastFocus = document.activeElement;
  ov.hidden = false;
  q.value = '';
  render();
  document.documentElement.style.overflow = 'hidden';
  setTimeout(() => q.focus(), 0);
}
function close(restoreFocus) {
  if (ov.hidden) return;
  ov.hidden = true;
  document.documentElement.style.overflow = '';
  if (restoreFocus !== false && lastFocus && lastFocus.focus) lastFocus.focus();
}
q.addEventListener('input', render);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setAct(act + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(act - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); go(act); }
  else if (e.key === 'Escape') { e.preventDefault(); close(); }
});
ov.addEventListener('click', e => {
  if (e.target === ov) { close(); return; }
  const a = e.target.closest('.ccp-i');
  if (a) { e.preventDefault(); go(+a.dataset.i); }
});
list.addEventListener('mousemove', e => { const a = e.target.closest('.ccp-i'); if (a && +a.dataset.i !== act) setAct(+a.dataset.i); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (ov.hidden) open(); else close(); return; }
  const typing = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  if (e.key === '/' && ov.hidden && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); open(); }
});
const btn = document.getElementById('ccSearchBtn');
if (btn) btn.addEventListener('click', open);
window.CCSearch = { open, close };

/* skip link: move focus without touching the hash (pages route on hashchange) */
const skip = document.querySelector('a.skip');
if (skip) skip.addEventListener('click', e => {
  const m = document.getElementById('main');
  if (!m) return;
  e.preventDefault();
  m.focus({ preventScroll: true });
  m.scrollIntoView({ block: 'start' });
});

/* daily tip (index only) */
const dt = document.getElementById('dailyTip');
const DAILY = IDX.daily || [];
if (dt && DAILY.length) {
  const now = new Date();
  let di = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5) % DAILY.length;
  const show = anim => {
    const t = DAILY[di];
    dt.innerHTML = '<span class="dl-ic" aria-hidden="true">今</span><div class="dl-b"><span class="dl-k">今日心法 · ' + esc(t[2]) + '</span><a class="dl-t" href="' + esc(t[3]) + '">' + esc(t[0]) + '</a><p>' + esc(t[1]) + '</p><div class="dl-a"><a class="btn small primary" href="' + esc(t[3]) + '">照著做 →</a><button class="btn small" type="button" data-next>換一條</button></div></div>';
    if (anim) { dt.classList.remove('pop'); void dt.offsetWidth; dt.classList.add('pop'); }
  };
  show(false);
  dt.hidden = false;
  dt.addEventListener('click', e => {
    if (!e.target.closest('[data-next]')) return;
    di = (di + 1 + Math.floor(Math.random() * Math.max(1, DAILY.length - 1))) % DAILY.length;
    show(true);
  });
}
})();
</script>
